<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zalora Daily Parcel Aging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Shipper MBR Dashboard shell — sticky deep-red top bar with tabs, filter strip, white section cards on light grey.
   Single fixed light look on purpose (matches the MBR dashboard for every viewer). */
:root{
  --nv-red:#C31524;--nv-deep:#9C0E1A;--nv-maroon:#721A19;
  --ramp-1:#E6B8AF;--ramp-2:#DD7E6B;--ramp-3:#CD4025;--ramp-4:#A61D01;--ramp-5:#980000;
  --pink:#F7CAC0;--pink-soft:#FBE7E2;
  --bg:#EFEFEF;--card:#FFFFFF;--panel:#F6F4F4;--text:#3F3F3F;--text-2:#505050;--muted:#8F8A8A;--grid:#D9D9D9;--line:#E4E0E0;
  --good:#2E7D4F;--good-bg:#E3F1E8;--bad:#C31524;--bad-bg:#FBE3E3;--warn:#9A6200;--warn-bg:#FFF1D6;
  --on-dark:#FFFFFF;--overlay:rgba(20,8,8,.5);--toast:#2A2223;
  --shadow:0 1px 2px rgba(60,20,20,.06),0 2px 8px rgba(60,20,20,.05);
  --font:'Montserrat',Arial,Helvetica,sans-serif;
  color-scheme:light;
}
html{background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--nv-red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nv-deep);color:var(--on-dark);box-shadow:0 2px 0 var(--nv-red)}
.topbar-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;margin-right:6px;gap:4px}
.brand-logo{height:24px;width:auto;max-width:none;object-fit:contain;display:block}
.brand span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:transparent;border:0;color:var(--on-dark);opacity:.78;padding:7px 10px;border-radius:6px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tab:hover{opacity:1;background:rgba(255,255,255,.08)}
.tab[aria-selected="true"]{opacity:1;background:var(--card);color:var(--nv-deep)}
.tab .cnt{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);border-radius:9px;padding:0 7px}
.tab[aria-selected="true"] .cnt{background:var(--bad-bg);color:var(--bad)}
.tb-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tb-right select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:var(--on-dark);border-radius:6px;padding:6px 8px;font-weight:600}
.tb-right select option{color:var(--text);background:var(--card)}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.banner.info{background:var(--pink-soft);color:var(--text)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}

.phead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin:4px 0 14px}
.phead h1{margin:0;font-size:clamp(20px,3vw,28px);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.phead h1 em{font-style:normal;color:var(--nv-red)}
.period{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-weight:700;font-size:13px;color:var(--text-2);flex-wrap:wrap}
.period .pill{background:var(--nv-red);color:var(--on-dark);border-radius:4px;padding:3px 8px;letter-spacing:.04em;text-transform:uppercase;font-size:12px}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--nv-red);border-color:var(--nv-red);color:var(--on-dark)}
.btn.primary:hover{background:var(--nv-deep)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2);padding:6px 8px}
.btn.ghost:hover{background:var(--panel)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}

.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;background:var(--card);border-radius:10px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--text-2);min-width:0}
.field select,.field input{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 9px;font-weight:500;font-size:13px;max-width:100%}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;padding-bottom:7px}
.switch input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--grid);position:relative;margin:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:left .15s}
.switch input:checked{background:var(--nv-red)}
.switch input:checked::after{left:16px}
.fsp{flex:1}

.sections{display:grid;gap:14px}
.sec{background:var(--card);border-radius:10px;box-shadow:var(--shadow);border-top:3px solid var(--text);min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec-h h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.sec-h .ic{width:34px;height:34px;border-radius:50%;background:var(--ramp-3);display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px var(--pink-soft)}
.sec-h .ic svg{width:18px;height:18px;color:var(--on-dark)}
.sec-h .sp{flex:1}
.sec-b{padding:14px 16px 16px;min-width:0}
.sec-sub{font-size:12px;color:var(--muted);margin:0 0 10px}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--panel);color:var(--text-2)}
.sub-h{font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--nv-maroon);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-b>.sub-h:first-child,.col>.sub-h:first-child{margin-top:0}

.hero{display:grid;grid-template-columns:minmax(220px,1fr) 2.2fr;gap:14px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-main{background:var(--nv-red);color:var(--on-dark);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.hero-main .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero-main .big{font-size:48px;font-weight:800;line-height:1;letter-spacing:-.02em;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.55);align-self:flex-start}
.hero-main .vs{font-size:13px;font-weight:600;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hero .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.hero .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:22px;font-weight:800}
.kpi .d{font-size:12px;color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;white-space:nowrap}
.chip.met{background:var(--good-bg);color:var(--good)}
.chip.below{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}

.tw{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{background:var(--ramp-3);color:var(--on-dark);font-weight:600;text-align:right;padding:7px 10px;white-space:nowrap;font-size:12px}
.t thead tr.grp th{background:var(--nv-maroon);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;text-align:center}
.t th:first-child,.t td:first-child{text-align:left}
.t td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.t tbody tr:nth-child(even) td{background:var(--panel)}
.t tfoot td{font-weight:700;border-top:2px solid var(--text-2);border-bottom:0}
.t td.l,.t th.l{text-align:left}
.t .gs{border-left:3px solid var(--pink)}
.t th.gs{border-left:3px solid rgba(255,255,255,.55)}
.t td.z{color:var(--grid)}
.t td.h1{background:var(--pink-soft)!important}
.t td.h2{background:var(--pink)!important}
.t td.h3{background:var(--ramp-1)!important}
.t td.h4{background:var(--ramp-2)!important;color:var(--on-dark)}
.t td.h5{background:var(--ramp-3)!important;color:var(--on-dark);font-weight:700}
.t td.brc{color:var(--bad);font-weight:800}
.t tr.rg td{background:var(--pink-soft)!important;font-weight:700;color:var(--nv-maroon)}
.t tr.rg td.h1,.t tr.rg td.h2,.t tr.rg td.h3,.t tr.rg td.h4,.t tr.rg td.h5{color:inherit}
.t tr.st td:first-child{padding-left:24px}
.t tr.seg td{background:var(--panel)!important;font-weight:800;color:var(--nv-maroon);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.more{margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:start}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}}
.col{min-width:0}
.chart{position:relative;height:280px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.legend-heat{display:inline-flex;gap:3px;align-items:center;font-size:11px;color:var(--muted);font-weight:600}
.legend-heat i{display:inline-block;width:14px;height:10px;border-radius:2px}

.wtm{background:var(--pink-soft);border:1px solid var(--pink);border-radius:8px;padding:10px 14px 12px}
.wtm-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--nv-maroon)}
.wtm-h svg{width:16px;height:16px}
.wtm ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13px}

.empty{padding:40px 20px;text-align:center;color:var(--text-2);display:grid;gap:10px;justify-items:center}
.empty b{font-size:17px;color:var(--text)}
.empty p{margin:0;max-width:52ch}
.rules{display:grid;gap:6px;font-size:13px;margin:0;padding-left:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}

.modal-bg{position:fixed;inset:0;background:var(--overlay);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);color:var(--text);border-radius:12px;max-width:620px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:16px 18px;display:grid;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card)}
.drop{border:2px dashed var(--grid);border-radius:10px;padding:22px;text-align:center;color:var(--text-2);display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--nv-red);background:var(--pink-soft)}
.preview{background:var(--panel);border-radius:8px;padding:12px;font-size:13px;display:grid;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast);color:var(--on-dark);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.t select,.t input[type=number]{border:1px solid var(--line);background:var(--card);border-radius:5px;padding:4px 6px;font-size:12.5px;font-weight:500;max-width:100%}
.t input[type=number]{width:64px;text-align:right}
.t tr.chg td{background:var(--warn-bg)!important}
.t td.ro{color:var(--muted)}
.sw{display:inline-flex;background:var(--panel);border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}
.sw button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:700;font-size:12.5px;color:var(--text-2)}
.sw button[aria-pressed="true"]{background:var(--nv-red);color:var(--on-dark)}
.chg-list{margin:4px 0 0;padding-left:18px;display:grid;gap:2px;font-size:12.5px;white-space:normal}
.chg-list b{color:var(--nv-maroon)}
.t td.wrap{white-space:normal;min-width:260px;max-width:560px;line-height:1.5}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px;font-size:12.5px;color:var(--text-2);margin:12px 0 0}
.legend b{color:var(--text)}
details.ver summary{cursor:pointer;font-weight:600;color:var(--nv-maroon)}
.mailbox{background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:16px 18px;overflow-x:auto;max-width:100%;color:#3F3F3F}
textarea{width:100%;resize:vertical;line-height:1.55;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 9px;font-size:13px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.otp-late{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}
.otp-sel{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 10px;font-weight:600;font-size:13px;max-width:100%}
.t tr.otp-row{cursor:pointer}
.t tr.otp-row:hover td{background:var(--pink-soft)}
.topbar-in{padding:5px 16px;flex-wrap:nowrap;gap:12px}
.brand{flex-direction:row;align-items:center;gap:8px;margin-right:2px;flex:none}
.brand-logo{height:17px}
.brand span{display:none}
.tabs{flex:1 1 auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;gap:2px}
.tab{padding:5px 9px;font-size:12.5px;white-space:nowrap;flex:none}
.tab .cnt{font-size:10.5px;padding:0 6px}
.tb-right{flex:none}
.tb-right select{padding:4px 8px;font-size:12.5px}
@media (max-width:760px){.topbar-in{flex-wrap:wrap}.tabs{order:3;flex-basis:100%}}
.t tr.seg-st td{background:var(--panel)!important}
.t tr.seg-st td:nth-child(2){padding-left:18px}
.t.otp-below tr.st td:nth-child(2){padding-left:36px;color:var(--text-2)}
.topbar-in{max-width:none;padding:5px 20px}
.tabs{flex-wrap:wrap;overflow:visible;row-gap:2px}
.tab{padding:5px 8px}
.wrap{max-width:1680px;padding-inline:20px}
.tw{overflow:visible}
table.t{table-layout:auto}
.t th{white-space:normal;line-height:1.25;vertical-align:bottom}
.t td{white-space:normal}
.t td:not(.l){white-space:nowrap}
.t td.l{overflow-wrap:anywhere}
.chip{white-space:nowrap}
@media (max-width:1100px){table.t{font-size:12px}.t th,.t td{padding:5px 6px}.t th{font-size:11px}}
.t input[type=text]{min-width:80px!important;width:100%;box-sizing:border-box}
.t input[type=date]{max-width:132px}
.t td.wrap{min-width:180px}
@media (max-width:760px){.tw{overflow-x:auto}}
.wim{border:1px solid var(--line);border-left:4px solid var(--bad);background:var(--card);border-radius:8px;padding:12px 14px;margin:8px 0 14px}
.wim.ok{border-left-color:var(--good)}
.wim-h{font-weight:800;color:var(--nv-maroon);margin-bottom:6px}
.wim ul{margin:0 0 10px;padding-left:18px}.wim li{margin:3px 0;line-height:1.45}
.wim .t{margin-top:4px}
td.rmk{min-width:300px;white-space:normal}
td.rmk .rmk-sel,td.rmk .rmk-note{display:inline-block;vertical-align:middle}
.rmk-sel{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:var(--card);color:inherit;max-width:100%}
.rmk-note{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;margin-left:4px;width:160px!important;max-width:45%;min-width:0!important;background:var(--card);color:inherit}
.rmk-ev{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

/* ---------- filtering & aggregation ---------- */
function locRegion(p){ return (p.seg==='RPU'||p.seg==='Pending pickup') ? p.oRegion : p.dRegion; }
function locState(p){ return (p.seg==='RPU'||p.seg==='Pending pickup') ? p.oState : p.dState; }
function filtered(seg){
  if(!S.data) return [];
  return S.data.parcels.filter(function(p){
    if(seg && p.seg!==seg) return false;
    if(S.f.group && p.group!==S.f.group) return false;
    if(S.f.region && locRegion(p)!==S.f.region) return false;
    if(S.f.br && !p.br) return false;
    return true;
  });
}
function agg(list, keyFn){
  var m={}, order=[];
  list.forEach(function(p){
    var k=keyFn(p); var o=m[k];
    if(!o){ o=m[k]={key:k,b:{},t:0,br:0,pd:0,mx:0,dt:0}; B.forEach(function(x){o.b[x]=0;}); order.push(k); }
    if(p.bucket) o.b[p.bucket]++; o.t++;
    if(p.br){ o.br++; o.pd+=p.pd; if(p.pd>o.mx) o.mx=p.pd; }
    if(p.pd===0) o.dt++;
  });
  return order.map(function(k){return m[k];});
}
function sumRows(rows, key){ var o={key:key,b:{},t:0,br:0,pd:0,mx:0,dt:0}; B.forEach(function(x){o.b[x]=0;}); rows.forEach(function(r){ B.forEach(function(x){o.b[x]+=r.b[x];}); o.t+=r.t; o.br+=r.br; o.pd+=r.pd; o.dt+=r.dt; if(r.mx>o.mx) o.mx=r.mx; }); return o; }
function heat(v, max){ if(!v) return 'z'; var r=v/max; return r>.8?'h5':r>.55?'h4':r>.3?'h3':r>.12?'h2':'h1'; }

/* Bucket table. opt: {label, br:boolean, limit, id, groups:[{row, kids}] } */
function bucketTable(rows, opt){
  var withBr = opt.br!==false, all = opt.groups ? opt.groups.map(function(g){return g.row;}) : rows.slice();
  var max = 1, scan = opt.groups ? [].concat.apply([], opt.groups.map(function(g){return g.kids;})) : all;
  scan.forEach(function(r){ B.forEach(function(x){ if(r.b[x]>max) max=r.b[x]; }); });
  var head = '<thead><tr class="grp"><th class="l"></th><th colspan="'+B.length+'">'+esc(opt.ageLabel||'Aging days')+'</th><th class="gs" colspan="'+(withBr?4:1)+'">'+(withBr?'SLA':'Volume')+'</th></tr><tr><th class="l">'+esc(opt.label)+'</th>'+B.map(function(x){return '<th>'+x+'</th>';}).join('')+'<th class="gs">Total</th>'+(withBr?'<th>Due today</th><th>Breached</th><th>Breach %</th>':'')+'</tr></thead>';
  function tr(r, cls){
    return '<tr'+(cls&&cls!=='tot'?' class="'+cls+'"':'')+'><td class="l">'+esc(r.key)+'</td>'+B.map(function(x){ var v=r.b[x]; return '<td class="'+(cls==='rg'||cls==='tot'?'':heat(v,max))+'">'+(v?nf(v):'–')+'</td>'; }).join('')+
      '<td class="gs"><b>'+nf(r.t)+'</b></td>'+(withBr?'<td>'+(r.dt?nf(r.dt):'–')+'</td><td class="'+(r.br?'brc':'z')+'">'+(r.br?nf(r.br):'–')+'</td><td>'+(r.br?'<span class="chip below">'+pct(r.br,r.t)+'</span>':'<span class="chip met">0%</span>')+'</td>':'')+'</tr>';
  }
  var body='';
  if(opt.groups){
    opt.groups.forEach(function(g){ body+=tr(g.row,'rg'); g.kids.forEach(function(k){ body+=tr(k,'st'); }); });
  } else {
    var lim = opt.limit && !S.more[opt.id] ? opt.limit : all.length;
    all.slice(0,lim).forEach(function(r){ body+=tr(r); });
  }
  var tot = sumRows(all, 'Total');
  var foot = all.length>1 || opt.groups ? '<tfoot>'+tr(tot,'tot')+'</tfoot>' : '';
  var more = (!opt.groups && opt.limit && all.length>opt.limit) ? '<div class="more"><button class="btn ghost" data-more="'+opt.id+'" type="button">'+(S.more[opt.id]?'Show top '+opt.limit+' only':'Show all '+all.length+' '+esc(opt.plural||'rows'))+'</button></div>' : '';
  if(!all.length) return '<div class="note">No parcels match the current filters.</div>';
  return '<div class="tw"><table class="t">'+head+'<tbody>'+body+'</tbody>'+foot+'</table></div>'+more;
}
function byTotal(a,b){ return b.t-a.t || b.br-a.br || String(a.key).localeCompare(String(b.key)); }
function byBreach(a,b){ return b.br-a.br || b.t-a.t || String(a.key).localeCompare(String(b.key)); }
function regionGroups(list, stateFn, regionFn){
  var regs = agg(list, regionFn), out=[];
  E.REGION_ORDER.forEach(function(rn){
    var r = regs.filter(function(x){return x.key===rn;})[0]; if(!r) return;
    var kids = agg(list.filter(function(p){return regionFn(p)===rn;}), stateFn).sort(byTotal);
    out.push({row:r, kids:kids});
  });
  return out;
}
function regionLevel(list, regionFn){ var regs=agg(list, regionFn); return E.REGION_ORDER.map(function(rn){ return regs.filter(function(x){return x.key===rn;})[0]; }).filter(Boolean); }

function killCharts(){ S.charts.forEach(function(c){ try{c.destroy();}catch(e){} }); S.charts=[]; }
function chartBase(){
  if(!window.Chart) return false;
  Chart.defaults.font.family = css('--font'); Chart.defaults.font.size = 12; Chart.defaults.color = css('--text-2');
  Chart.defaults.borderColor = css('--grid'); Chart.defaults.plugins.legend.labels.boxWidth = 12;

}

  html += sec('alert','SLA breach summary', '<p class="sec-sub">Parcels still open after their SLA due date, using the SLA effective from '+esc(fmtD(slaForDate(S.data.asOf).effectiveFrom))+' (see SLA Settings). Pending pickup is outside SLA scope.</p>'+summary);
  html += '<div class="grid2 even">'+sec('clock','Aging profile by segment','<p class="sec-sub">Open parcels by days since clock start.</p><div class="chart"><canvas id="cAging" aria-label="Aging buckets by segment"></canvas></div>')+
    sec('trend','Daily trend','<p class="sec-sub">Breached and in-scope parcels for each saved day'+(S.f.group||S.f.region||S.f.br?' (all parcels; filters do not apply here)':'')+'.</p><div class="chart"><canvas id="cTrend" aria-label="Daily breach trend"></canvas></div>'+(S.snaps.length<2?'<div class="note">The trend fills in as a file is saved each day.</div>':''))+'</div>';

    {label:'In SLA scope',data:sn.map(function(s){return s.kpi&&s.kpi.inScope;}),borderColor:css('--grid'),backgroundColor:css('--grid'),borderDash:[5,4],tension:.25,pointRadius:3,yAxisID:'y1'}]},

function kpi(l,v,d){ return '<div class="kpi"><div class="lbl">'+esc(l)+'</div><div class="v">'+v+'</div><div class="d">'+esc(d)+'</div></div>'; }
function watch(all,k){
  var out=[], sc=all.filter(function(p){return p.seg!=='Pending pickup';});
  if(!sc.length && !k.pending) return ['No parcels match the current filters.'];
  out.push('<b>'+nf(k.breached)+'</b> parcels are past SLA ('+pct(k.breached,k.inScope)+' of in-scope); <b>'+nf(k.dueToday)+'</b> reach their due date today.');
  var hubs = agg(sc.filter(function(p){return p.br;}), function(p){return p.hub;}).sort(byBreach).slice(0,3);
  if(hubs.length) out.push('Most breached dest hubs: '+hubs.map(function(h){return '<b>'+esc(h.key)+'</b> ('+h.br+')';}).join(', ')+'.');
  var routes = agg(sc, function(p){return p.route;}).filter(function(r){return r.t>=30&&r.br;}).sort(function(a,b){return b.br/b.t-a.br/a.t;});
  if(routes[0]) out.push('Highest breach rate by route: <b>'+esc(routes[0].key)+'</b> at '+pct(routes[0].br,routes[0].t)+' ('+routes[0].br+' of '+nf(routes[0].t)+').');
  var grp = agg(sc, function(p){return p.group;}).filter(function(r){return r.br;}).sort(byBreach);
  if(grp[0]) out.push('Most breached Parent ID Group: <b>'+esc(grp[0].key)+'</b> with '+grp[0].br+' ('+pct(grp[0].br,grp[0].t)+' of its open parcels).');
  if(k.pending10){ var ret = all.filter(function(p){return p.seg==='Pending pickup'&&p.age>=10&&p.route==='Return';}).length; out.push('<b>'+nf(k.pending10)+'</b> orders have waited 10+ days for pickup ('+nf(ret)+' are customer returns). These sit outside SLA but will age into RPU once collected.'); }
  return out;
}

function viewSeg(seg){

  var locWord = (isRpu||isPend) ? 'origin (pickup) location' : seg==='RTS' ? 'original delivery destination' : 'destination';
  var k = agg(list, function(){return 'x';})[0] || {t:0,br:0,dt:0};
  html += '<div class="kpis">'+kpi('Open parcels', nf(k.t), seg)+(br?kpi('Breached', nf(k.br), pct(k.br,k.t)+' of open')+kpi('Due today', nf(k.dt), 'reach SLA date today'):'')+
    kpi('Aged 7+ days', nf(list.filter(function(p){return p.age>=7;}).length), ageLabel.toLowerCase())+(isPend?kpi('Returns waiting', nf(list.filter(function(p){return p.route==='Return';}).length), 'customer return pickups')+kpi('Forward waiting', nf(list.filter(function(p){return p.route==='Forward';}).length), 'merchant pickups'):'')+'</div>';

  var legend = '<span class="legend-heat">Fewer<i style="background:var(--pink-soft)"></i><i style="background:var(--pink)"></i><i style="background:var(--ramp-1)"></i><i style="background:var(--ramp-2)"></i><i style="background:var(--ramp-3)"></i>More</span>';
  html += sec('box','Aging by Parent ID Group', bucketTable(agg(list,function(p){return p.group;}).sort(byTotal), {label:'Parent ID Group', br:br, ageLabel:ageLabel}), legend);
  if(!isPend){
    var hubs = agg(list,function(p){return p.hub;}).sort(br?byBreach:byTotal);
    html += sec('hub','Aging by Dest Hub', '<p class="sec-sub">Sorted by breached parcels, then volume.'+(isRpu?' Most RPU returns route to MM-RTS (Zalora warehouse).':'')+'</p><div class="chart" style="height:240px"><canvas id="cHub" aria-label="Top dest hubs by breached parcels"></canvas></div><div class="sub-h">All aging buckets by hub</div>'+bucketTable(hubs,{label:'Dest Hub', br:br, limit:15, id:seg+'hub', plural:'hubs', ageLabel:ageLabel}));
  }
  var rf = (isRpu||isPend) ? function(p){return p.oRegion;} : function(p){return p.dRegion;};
  var sf = (isRpu||isPend) ? function(p){return p.oState;} : function(p){return p.dState;};
  html += sec('map','Aging by Region and State', '<p class="sec-sub">Location = '+locWord+', from postcode.</p><div class="sub-h">Region level</div>'+bucketTable(regionLevel(list,rf),{label:'Region', br:br, ageLabel:ageLabel})+
    '<div class="sub-h">State &amp; Region</div>'+bucketTable([], {label:'Region / State', br:br, ageLabel:ageLabel, groups:regionGroups(list,sf,rf)}));
  html += sec('status','Aging by granular status', bucketTable(agg(list,function(p){return p.status;}).sort(byTotal), {label:'Granular status', br:br, ageLabel:ageLabel}));
  if(seg==='Forward' || seg==='RPU') html += sec('rule','Aging by route', bucketTable(agg(list,function(p){var t=slaTxtFor(p.route); return p.route+(t?' · '+t:'');}).sort(byTotal), {label:'Route · SLA', br:br, ageLabel:ageLabel}));
  $('view').innerHTML = html;
  if(!isPend){
    var top = agg(list.filter(function(p){return p.br;}),function(p){return p.hub;}).sort(byBreach).slice(0,10);
    if(!top.length) top = agg(list,function(p){return p.hub;}).sort(byTotal).slice(0,10);
    var useBr = top.length && top[0].br;
    drawChart('cHub',{type:'bar',data:{labels:top.map(function(h){return h.key;}),datasets:[{label:useBr?'Breached':'Open parcels',data:top.map(function(h){return useBr?h.br:h.t;}),backgroundColor:css(useBr?'--nv-red':'--ramp-2'),borderRadius:3}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:useBr?'Top 10 hubs by breached parcels':'Top 10 hubs by open parcels'}},scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}}}});
  }
}

/* ---------- SLA versions: compute per report date ---------- */
function sv(x){ return x==null ? '' : String(x); }
var SLA_EDIT_FIELDS = ['days','basis','skipHol','holState','inc'];
function computeDay(date, file){
  var ver = slaForDate(date), c = S.cache[date];
  if(c && !c.local && c.slaId===ver.id && c.slaSaved===ver.savedAt && c.holKey===E.holKey()) return c;
  var d = E.compute(S.rows[date], date, ver.rules); d.file = file || (c&&c.file) || ''; d.slaId = ver.id; d.slaSaved = ver.savedAt; d.holKey = E.holKey(); S.cache[date] = d; return d;
}
function refreshForSla(){
  if(!S.data) return;
  var date = S.data.asOf;
  if(S.data.local && S.localRows && S.localRows.date===date){
    var ver = slaForDate(date); if(S.data.slaId===ver.id && S.data.slaSaved===ver.savedAt) return;
    var d = E.compute(S.localRows.rows, date, ver.rules); d.file = S.localRows.file; d.local = true; d.slaId = ver.id; d.slaSaved = ver.savedAt; S.cache[date] = d; S.data = d;
  } else if(S.rows[date]) S.data = computeDay(date, S.data.file);
}
function chgList(ch){ return '<ul class="chg-list">'+ch.map(function(c){ return '<li>'+esc(c.rule)+' · '+esc(c.field)+': '+esc(c.from)+' → <b>'+esc(c.to)+'</b></li>'; }).join('')+'</ul>'; }
function rowChanged(r, base){ return SLA_EDIT_FIELDS.some(function(k){ return sv(base[k])!==sv(r[k]); }); }
function setDraft(el){
  var r = S.slaDraft.filter(function(x){return x.id===el.dataset.sla;})[0]; if(!r) return;
  var f = el.dataset.f, v = el.value; r[f] = f==='days' ? (v==='' ? null : +v) : v;
  var base = E.slaMap(latestVer().rules), tr = el.closest('tr');
  if(tr) tr.classList.toggle('chg', rowChanged(r, base[r.id]));
  countDraft();
}
function countDraft(){
  var c = $('draftCount'); if(!c || !S.slaDraft) return;
  var base = E.slaMap(latestVer().rules), n = S.slaDraft.filter(function(x){ return rowChanged(x, base[x.id]); }).length;
  c.textContent = n ? n+' row'+(n>1?'s':'')+' changed' : 'No changes yet';
}

/* ---------- review + save SLA ---------- */
function reviewSla(raw, source, tplVer){
  var v = E.validateSla(raw), latest = latestVer(), m = E.slaMap(latest.rules);
  v.rules.forEach(function(r){ SLA_EDIT_FIELDS.forEach(function(k){ m[r.id][k] = r[k]; }); });
  var merged = E.SLA_IDS.map(function(id){ var o = m[id]; return {id:id, days:o.days, basis:o.basis, skipHol:o.skipHol, holState:o.holState, inc:o.inc}; });
  if(v.errors.length){
    openModal('Fix the SLA before saving', '<div class="banner bad">'+v.errors.length+' problem'+(v.errors.length>1?'s':'')+' found. Nothing was saved.</div><ul class="chg-list">'+v.errors.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>', '<button class="btn primary" data-act="close" type="button">Close</button>');
    return;
  }
  var changes = E.diffSla(latest.rules, merged);
  if(!changes.length){
    openModal('No changes to save', '<p>This SLA is the same as the latest version (effective from '+esc(fmtD(latest.effectiveFrom))+').</p>'+(v.warnings.length && source!=='Edited in page' ? '<ul class="chg-list">'+v.warnings.map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul>' : ''), '<button class="btn primary" data-act="close" type="button">Close</button>');
    return;
  }
  S.slaPending = {rules:merged, changes:changes, source:source};
  var today = todayLocal();
  var body = '<div class="tw"><table class="t"><thead><tr><th class="l">Parcel type</th><th class="l">Field</th><th class="l">Current</th><th class="l">New</th></tr></thead><tbody>'+
    changes.map(function(c){ return '<tr><td class="l">'+esc(c.rule)+'</td><td class="l">'+esc(c.field)+'</td><td class="l">'+esc(c.from)+'</td><td class="l"><b>'+esc(c.to)+'</b></td></tr>'; }).join('')+'</tbody></table></div>'+
    '<div class="field"><label for="slaEff">Effective from</label><input id="slaEff" type="date" min="'+today+'" value="'+today+'"></div>'+
    '<div class="field"><label for="slaNote">Reason for change (shown in Updates)</label><input id="slaNote" type="text" maxlength="200" placeholder="e.g. Agreed with Zalora on 14 Oct"></div>'+
    '<div class="preview" id="slaImpact"></div>'+
    (v.warnings.length && source!=='Edited in page' ? '<details class="ver"><summary>'+v.warnings.length+' row'+(v.warnings.length>1?'s':'')+' not in the file keep their current value</summary><ul class="chg-list">'+v.warnings.map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul></details>' : '')+

function nk(o){ var r={}; for(var k in o) r[String(k).trim().toLowerCase().replace(/\s+/g,'_')] = o[k]; return r; }
function svcType(r){

    if(String(r.is_pickup_required||'').trim()==='0') return 'RDO';

function buildEmail(rawRows, asOf){
  var seen = {}, rows = [];

    var sc = E.dayOf(r.start_clock_date), age = sc ? E.diffDays(asOf, sc) : null;
    var hub = String(r.dest_hub||'').trim(), sweep = String(r.last_sweep_hub||'').trim();
    var ds = E.stateOf(String(r.ori_to_postcode||'').trim() || r.dest_postcode), cr = E.dayOf(r.creation_datetime);
    rows.push({ tid:tid, shipper:String(r.shipper_name||''), svc:svcType(r), status:String(r.granular_status||'').trim(), att:+(r.delivery_attempts||0)||0,
      start:sc, age:age, aging:ageLabel(age), hub:hub||'(blank)', sweepHub:sweep, sweepAt:String(r.last_sweep_datetime||''), atHub: (!!hub && !!sweep && hub.toUpperCase()===sweep.toUpperCase()) || AT_HUB_STATUS.indexOf(String(r.granular_status||'').trim())>=0,
      dState:ds, dReg:E.regionOf(ds), rts:String(r.rts_flag||'')==='1'?1:0, comments:String(r.order_comments||''),
      puHub:String(r.pickup_hub||'').trim(), created:cr, sched:E.dayOf(r.scheduled_pickup_date), puAge: E.dayOf(r.scheduled_pickup_date) ? E.diffDays(asOf, E.dayOf(r.scheduled_pickup_date)) : null, puTries:+(r.total_pickup_attempts||0)||0, puAtt: String(r.last_pickup_attempt_datetime||'').trim()!=='', puFail:String(r.last_pickup_attempt_failure_reason||''),
      firstAtt:String(r['1st_attempt_datetime']||'') });
  });

  var nm = {}; nddList.forEach(function(p){ var o = nm[p.hub] || (nm[p.hub] = {hub:p.hub, c1:0, c2:0, t:0}); if(p.age===1) o.c1++; else o.c2++; o.t++; });
  var ndd = Object.keys(nm).map(function(k){return nm[k];}).sort(function(a,b){ return b.t-a.t || a.hub.localeCompare(b.hub); });

  function hubTable(list){
    var g = {}; list.forEach(function(p){ var R = g[p.dReg] || (g[p.dReg] = {}); var h = R[p.hub] || (R[p.hub] = {hub:p.hub, b:AGE_BK.map(function(){return 0;}), t:0}); var i = bkOf(p.age, AGE_BK); if(i>=0) h.b[i]++; h.t++; });
    return EM_REG_ORDER.filter(function(r){ return g[r]; }).map(function(r){

      var sub = {b:AGE_BK.map(function(_,i){ return hubs.reduce(function(s,h){return s+h.b[i];},0); }), t:hubs.reduce(function(s,h){return s+h.t;},0)};
      return {region:r, hubs:hubs, sub:sub};
    });
  }
  var wmList = agedList.filter(function(p){ return p.dReg!=='East Malaysia'; }), emList = agedList.filter(function(p){ return p.dReg==='East Malaysia'; });
  var isAon = function(h){ return /AON/i.test(h); };
  /* 4. RPU pickup aging: return pickups not yet picked up (Pending Pickup / Van en-route to pickup),
        aged from the scheduled pickup date to the report date; future dates = Not yet due */
  var rpuList = rows.filter(function(p){ return /^RPU/.test(p.svc) && !p.start && RPU_STATUS.indexOf(p.status.toLowerCase())>=0; });
  var rpuAll = rpuList;
  var rpuDueList = rpuList.filter(function(p){ return p.puAge!=null && p.puAge>=0; }); /* due today or overdue: the report tables */
  function puTable(list){

    var od = function(o){ return o.b.slice(1).reduce(function(s,v){return s+v;},0); };
    return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){ return od(b)-od(a) || b.b[0]-a.b[0] || b.t-a.t || a.hub.localeCompare(b.hub); });
  }

    rpuLM:puTable(rpuDueList.filter(function(p){return !isAon(p.puHub);})), rpuAON:puTable(rpuDueList.filter(function(p){return isAon(p.puHub);})), rpuList:rpuList, rpuAll:rpuAll,
    k:{ ndd:nddList.length, ndd1:nddList.filter(function(p){return p.age===1;}).length, wm:wmList.length, em:emList.length, over15:agedList.filter(function(p){return p.age>15;}).length, rpu:rpuList.length, rpuShown:rpuDueList.length, rpuDue:rpuList.filter(function(p){return p.puAge!=null && p.puAge>=1;}).length, rpuAll:rpuAll.length, rows:rows.length } };
}

    stage('lm', mmDone, fa, mmDone && !fa);
    x.st = st; x.odd = odd; x.tg = tg;
    /* where it is now */
    var sweep = String(r.last_sweep_hub||'').trim().toUpperCase(), hub = String(p.hub||'').toUpperCase(), status = p.status;
    var now_d;
    if(!ib && !(sweep && sweep===hub)) now_d = 'fm';
    else if((sweep && sweep===hub) || AT_HUB_STATUS.indexOf(status)>=0 || (+r.delivery_attempts||0)>0 || fa) now_d = 'lm';
    else if(vn && (!mmDone || (lsv && lsv>mmDone))) now_d = 'mm';
    else if(/^MM-/.test(sweep) || /XDK|CROSSDOCK/.test(sweep)) now_d = 'mm';
    else now_d = 'sort';
    x.now = now_d;
    /* main delay stage = biggest hours over target */
    var best = null; DEPTS.forEach(function(d){ var s = st[d.id]; if(s && s.over>0 && (!best || s.over>st[best].over)) best = d.id; });
    x.delay = best; x.sweep = r.last_sweep_hub||'(no scan yet)'; x.pickupHub = r.pickup_hub||'(no pickup hub)'; x.att = +(r.delivery_attempts||0)||0;
    x.lane = regionOfPc(r.from_postcode)+' → '+p.dRegion;
    return x;
  });
  var br = rows.filter(function(x){ return x.p.br; }), dueToday = rows.filter(function(x){ return x.p.pd===0; }), dueTmr = rows.filter(function(x){ return x.p.pd===-1; });
  var D = {};
  DEPTS.forEach(function(d){
    var passed = rows.filter(function(x){ return x.st[d.id] && !x.st[d.id].open; }), openHere = rows.filter(function(x){ return x.now===d.id && x.st[d.id] && x.st[d.id].open; });
    var overAll = passed.filter(function(x){ return x.st[d.id].over>0; }).length;
    D[d.id] = { d:d, nowBr:br.filter(function(x){ return x.now===d.id; }), delayBr:br.filter(function(x){ return x.delay===d.id; }),
      nowDue:dueToday.filter(function(x){ return x.now===d.id; }), nowTmr:dueTmr.filter(function(x){ return x.now===d.id; }),
      med:median(passed.map(function(x){ return x.st[d.id].h; })), passed:passed.length, overPct:passed.length ? overAll/passed.length : null,
      openOver:openHere.filter(function(x){ return x.st[d.id].over>0; }) };
  });

    noDelay:br.filter(function(x){ return !x.delay; }), ret:S.data.parcels.filter(function(p){ return (p.seg==='RTS'||p.seg==='RPU') && p.br; }) };
  A.actions = buildActions(A);

}
function topBy(list, keyFn, n){ var m = {}; list.forEach(function(x){ var k = keyFn(x) || '(blank)'; m[k] = (m[k]||0)+1; }); return Object.keys(m).map(function(k){ return {k:k, n:m[k]}; }).sort(function(a,b){ return b.n-a.n || a.k.localeCompare(b.k); }).slice(0, n||5); }
function topTxt(t){ return t.map(function(o){ return '<b>'+esc(o.k)+'</b> ('+o.n+')'; }).join(', '); }

/* ---------- takeaways (facts) and suggestions (labelled) per department ---------- */
function deptInsights(A, id){
  var X = A.D[id], f = [], s = [], d = X.d;
  var tg = id==='mm' ? TGT.mmWM+' h West / '+TGT.mmEM+' h East' : TGT[id]+' h';
  f.push(X.nowBr.length+' breached parcels are with '+d.name+' now; '+X.delayBr.length+' breached parcels lost the most time at this stage.');
  if(X.med!=null) f.push('Median time at this stage today: '+h1(X.med)+' against a '+tg+' target; '+Math.round((X.overPct||0)*100)+'% of '+nf(X.passed)+' parcels that finished this stage took longer than target.');
  if(X.nowDue.length || X.nowTmr.length) f.push(X.nowDue.length+' parcels with '+d.name+' reach their SLA date today and '+X.nowTmr.length+' tomorrow.');
  if(id==='lm'){
    var zero = X.nowBr.filter(function(x){ return x.att===0; }), multi = X.nowBr.filter(function(x){ return x.att>=2; }), hold = X.nowBr.filter(function(x){ return x.p.status==='On Hold'; });
    if(X.nowBr.length) f.push('Top hubs holding breached parcels: '+topTxt(topBy(X.nowBr, function(x){ return x.p.hub; }, 4))+'.');
    if(zero.length) f.push(zero.length+' of them have no delivery attempt yet; '+multi.length+' have had 2 or more attempts; '+hold.length+' are On Hold.');
    if(zero.length) s.push('Give breached parcels with no attempt first priority on today’s routes at '+topTxt(topBy(zero, function(x){ return x.p.hub; }, 3))+'.');
    if(multi.length) s.push('Review the failure reasons on the '+multi.length+' parcels with 2+ attempts before a further attempt; contacting the customer first may avoid another failed trip.');
    if(hold.length) s.push('Ask the hubs to clear or explain the '+hold.length+' On Hold breached parcels.');
    if(X.nowDue.length) s.push('Plan the '+X.nowDue.length+' parcels due today into today’s dispatch to stop them breaching tonight.');
  }
  if(id==='sort'){
    if(X.nowBr.length) f.push('Breached parcels waiting at sort hubs (last scan): '+topTxt(topBy(X.nowBr, function(x){ return x.sweep; }, 4))+'.');
    if(X.openOver.length) f.push(X.openOver.length+' parcels (breached or not) have been inbounded but not loaded onto a middle-mile van for longer than '+TGT.sort+' h.');
    if(X.openOver.length) s.push('Check whether the '+X.openOver.length+' parcels inbounded more than '+TGT.sort+' h ago missed a line-haul cut-off, and load them on the next van.');
    if(X.delayBr.length) s.push('Compare sort-to-van times for the top hubs with the line-haul schedule to see if a cut-off change would help.');
  }
  if(id==='mm'){
    if(X.nowBr.length) f.push('Breached parcels in middle-mile transit by lane: '+topTxt(topBy(X.nowBr, function(x){ return x.lane; }, 4))+'.');
    if(X.delayBr.length) f.push('Lanes where middle mile was the biggest delay: '+topTxt(topBy(X.delayBr, function(x){ return x.lane; }, 4))+'.');
    if(X.openOver.length) s.push('Trace the '+X.openOver.length+' parcels on a van longer than target; '+topTxt(topBy(X.openOver, function(x){ return x.lane; }, 3))+' have the most.');
    if(X.delayBr.length) s.push('Review departure frequency on the slowest lanes with line-haul planning.');
  }
  if(id==='fm'){
    if(X.nowBr.length) f.push('Breached parcels picked up but not inbounded, by pickup hub: '+topTxt(topBy(X.nowBr, function(x){ return x.pickupHub; }, 4))+'.');
    if(X.openOver.length) f.push(X.openOver.length+' parcels were picked up more than '+TGT.fm+' h ago and are not yet inbounded.');
    if(X.openOver.length) s.push('Ask pickup teams to inbound the '+X.openOver.length+' parcels picked up more than '+TGT.fm+' h ago; the SLA clock is already running.');
  }
  if(!s.length) s.push('Nothing stands out today. Keep watching parcels due today.');
  return {f:f, s:s};
}

/* ---------- action plan: generated from the data, tracked in the shared store ---------- */
function buildActions(A){
  var out = [];
  function add(id, dept, text, n, pri){ out.push({id:id.replace(/[^A-Za-z0-9_\-.~:@+]/g,'_'), dept:dept, text:text, n:n, pri:pri, owner:A.D[dept].d.owner}); }
  var lm = A.D.lm;
  topBy(lm.nowBr, function(x){ return x.p.hub; }, 6).forEach(function(o){
    if(o.n<2) return; var z = lm.nowBr.filter(function(x){ return x.p.hub===o.k && x.att===0; }).length;
    add('LM_BR_'+o.k, 'lm', 'Clear '+o.n+' breached parcels at '+o.k+(z?' ('+z+' with no attempt yet)':'')+' — first-priority attempt on today’s routes.', o.n, (o.n>=5||z)?'High':'Medium');
  });
  topBy(lm.nowDue, function(x){ return x.p.hub; }, 5).forEach(function(o){ if(o.n>=5) add('LM_DUE_'+o.k, 'lm', 'Attempt the '+o.n+' parcels due today at '+o.k+' to prevent new breaches.', o.n, 'High'); });
  var hold = lm.nowBr.filter(function(x){ return x.p.status==='On Hold'; }); if(hold.length>=3) add('LM_HOLD', 'lm', 'Resolve or explain '+hold.length+' On Hold breached parcels ('+topBy(hold, function(x){ return x.p.hub; }, 3).map(function(o){ return o.k; }).join(', ')+').', hold.length, 'Medium');
  var multi = lm.nowBr.filter(function(x){ return x.att>=2; }); if(multi.length>=3) add('LM_MULTI', 'lm', 'Contact customers before re-attempting '+multi.length+' breached parcels with 2+ failed attempts.', multi.length, 'Medium');
  topBy(A.D.sort.openOver, function(x){ return x.sweep; }, 4).forEach(function(o){ if(o.n>=3) add('SORT_'+o.k, 'sort', 'Load '+o.n+' parcels waiting more than '+TGT.sort+' h at '+o.k+' onto the next middle-mile van.', o.n, o.n>=10?'High':'Medium'); });
  topBy(A.D.mm.openOver, function(x){ return x.lane; }, 3).forEach(function(o){ if(o.n>=3) add('MM_'+o.k, 'mm', 'Trace and expedite '+o.n+' parcels over the transit target on lane '+o.k+'.', o.n, o.n>=10?'High':'Medium'); });
  topBy(A.D.fm.openOver, function(x){ return x.pickupHub; }, 3).forEach(function(o){ if(o.n>=3) add('FM_'+o.k, 'fm', 'Inbound '+o.n+' parcels picked up more than '+TGT.fm+' h ago (pickup hub '+o.k+').', o.n, o.n>=10?'High':'Medium'); });
  var rank = {High:0, Medium:1, Low:2};
  out = out.sort(function(a,b){ return rank[a.pri]-rank[b.pri] || b.n-a.n; });
  A.moreActions = Math.max(0, out.length-15);
  return out.slice(0, 15);
}

      if(p.status && p.status!=='completed') throw {code:'tool_error', message:String(p.error || p.status)};
      var d = p.data || {}; rows = rows.concat(d.rows || []); pages++;

/* ---------- loading files ---------- */
function parseCsvText(text){ var r = Papa.parse(text,{header:true,skipEmptyLines:true}); return r.data; }
function readFile(file){
  return new Promise(function(res,rej){
    var fr = new FileReader(), isX = /\.xlsx?$/i.test(file.name);
    fr.onerror = function(){ rej(new Error('The file could not be read.')); };
    fr.onload = function(){
      try{
        if(isX){
          if(!window.XLSX) throw new Error('The Excel reader did not load. Save the file as CSV and try again.');
          var wb = XLSX.read(fr.result,{type:'array'}), ws = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(ws,{raw:false,defval:'',dateNF:'yyyy-mm-dd hh:mm:ss'});
          res({rows:rows, csv:Papa.unparse(rows)});
        } else { var t = String(fr.result).replace(/^﻿/,''); res({rows:parseCsvText(t), csv:t}); }
      }catch(e){ rej(e); }
    };
    if(isX) fr.readAsArrayBuffer(file); else fr.readAsText(file);
  });
}
function dateFromName(n){ var m = String(n).match(/(20\d{2})[_\-.](\d{2})[_\-.](\d{2})/); return m ? m[1]+'-'+m[2]+'-'+m[3] : ''; }

/* ---------- raw file storage ----------
   Normal file storage first. People invited from outside the organisation can't store CSV files there,
   so their upload is gzip-compressed and saved in the shared data store in ~200 KB pieces instead. */
var CHUNK = 200000;
function gz(text){ return new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); }
function gunz(buf){ return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }
function b64ToBuf(s){ var bin = atob(s), u = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u.buffer; }
function storeChunks(date, csv){
  if(!window.CompressionStream) return Promise.reject(new Error('this browser can’t compress the file. Use the latest Chrome or Edge'));
  return gz(csv).then(function(buf){
    var b64 = abToB64(buf), n = Math.ceil(b64.length/CHUNK), key = date+'_'+Date.now(), ps = [];
    for(var i=0;i<n;i++) ps.push(S.db.doc('rawChunks/'+key+'_'+i).set({date:date, i:i, n:n, data:b64.slice(i*CHUNK,(i+1)*CHUNK)}));
    return Promise.all(ps).then(function(){ return {chunkKey:key, chunks:n}; });
  });
}
function storeRaw(p){
  var viaAsset = S.assets ? S.assets.upload(new Blob([p.csv],{type:'text/csv'}),{type:'text/csv'}).then(function(up){ return {assetId:up.id}; }) : Promise.reject({code:'no_assets'});
  return viaAsset.catch(function(e){ if(e && e.code==='too_large') throw e; return storeChunks(p.date, p.csv); });
}
function dropChunks(s){ if(!s || !s.chunkKey || !S.db) return; for(var i=0;i<(s.chunks||0);i++) S.db.doc('rawChunks/'+s.chunkKey+'_'+i).delete().catch(function(){}); }
function fetchRawText(s){
  if(s.assetId) return fetch('/api/blobs/'+encodeURIComponent(s.assetId), {credentials:'same-origin'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); });
  if(s.chunkKey && S.db){
    var ps = []; for(var i=0;i<(s.chunks||0);i++) ps.push(S.db.doc('rawChunks/'+s.chunkKey+'_'+i).get());
    return Promise.all(ps).then(function(snaps){
      var b64 = snaps.map(function(d){ if(!d.exists) throw new Error('part of the saved file is missing'); return d.data().data; }).join('');
      if(!window.DecompressionStream) throw new Error('this browser can’t open compressed files');
      return gunz(b64ToBuf(b64));
    });
  }
  return Promise.reject(new Error('no saved file'));
}

function loadSnap(date){
  var s = S.snaps.filter(function(x){return x.date===date;})[0];
  S.date = date;
  if(S.rows[date]){ S.data = computeDay(date, s?s.file:''); render(); return; }
  if(S.cache[date]){ S.data = S.cache[date]; render(); return; }
  if(!s || !(s.assetId || s.chunkKey)){ render(); return; }
  S.loading = true; S.data = null; render();
  fetchRawText(s).then(function(t){
    S.rows[date] = parseCsvText(t.replace(/^﻿/,'')); var d = computeDay(date, s.file);
    if(S.date===date){ S.data=d; S.loading=false; render(); }
  }).catch(function(){ S.loading=false; S.data=null; render(); toast('The saved file for '+fmtD(date)+' could not be opened. Try uploading it again.'); });
}

function saveShared(){
  var p = pending, btn = document.querySelector('[data-act="save"]'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  var prev = S.snaps.filter(function(s){return s.date===p.date;})[0];
  storeRaw(p).then(function(st){
    var now = new Date().toISOString(), replaced = !!prev;
    var doc = {date:p.date, file:p.file, rows:p.data.quality.rows, uploadedAt:now, by:S.me||'', kpi:p.kpi, slaId:p.data.slaId, exp:expStats(p.data.parcels)};
    if(st.assetId) doc.assetId = st.assetId; else { doc.chunkKey = st.chunkKey; doc.chunks = st.chunks; }
    return S.db.doc('snapshots/'+p.date).set(doc).then(function(){
      return S.db.doc('log/u'+Date.now()).set({type:'upload', at:now, by:S.me||'', date:p.date, file:p.file, rows:doc.rows, breached:p.kpi.breached, inScope:p.kpi.inScope, pending:p.kpi.pending, replaced:replaced, slaEffectiveFrom:slaForDate(p.date).effectiveFrom}).catch(function(){});

    var d=p.data; d.file=p.file; d.local=false; S.rows[p.date]=p.rows; S.cache[p.date]=d; S.date=p.date; S.data=d;
    if(prev && prev.chunkKey && prev.chunkKey!==doc.chunkKey) dropChunks(prev);
    S.snaps = S.snaps.filter(function(s){return s.date!==p.date;}).concat([doc]);
    closeModal(); render(); toast('Saved '+fmtD(p.date)+' to the team history.');
  }).catch(function(e){
    if(btn){ btn.disabled=false; btn.textContent='Save to team history'; }
    var m = e&&e.code==='too_large' ? 'The file is too large to save (20 MB limit).' : e&&(e.code==='not_granted'||e.code==='invalid_argument') ? 'You don’t have permission to save to this dashboard. Ask the owner for Editor access.' : 'Saving failed'+(e&&e.message?': '+e.message:'.')+' You can still choose View only.';

  });

$('fBr').addEventListener('change',function(){ S.f.br=this.checked; render(); });
$('fReset').addEventListener('click',function(){ S.f={group:'',region:'',br:false}; render(); });
$('dateSel').addEventListener('change',function(){ if(/^\d{4}-/.test(this.value)) loadSnap(this.value); });

render();

/* ---------- capabilities ---------- */
var cl = window.claude;
if(cl && cl.use){
  cl.use('downloads').then(function(d){ S.downloads=d; }).catch(function(){});
  cl.use('mcp').then(function(m){ S.mcp=m; if(m && m.listTools) m.listTools().then(function(r){ S.fileArgs = !!(r && r.fileArgs); }).catch(function(){}); if(S.tab==='email') render(); if(S.tab==='express' && m) otpEnsure(); }).catch(function(){});
  cl.use('assets').then(function(a){ S.assets=a; if(pending && $('pv')) previewPending(); }).catch(function(){});
  cl.use('user').then(function(u){ S.user=u; if(!u) return; if(u.canEdit) u.canEdit().then(function(v){ S.canEdit=!!v; render(); }).catch(function(){}); if(u.id) return u.id().then(function(id){ S.me=id||''; render(); resolveNames(); }); }).catch(function(){});
  cl.use('db').then(function(db){
    if(!db){ S.dbState='off'; render(); return; }
    S.db=db; S.dbState='ready';
    db.collection('slaVersions').limit(500).onSnapshot(function(snap){
      S.slaVersions = snap.docs.map(function(d){ var x=d.data()||{}; x.id=d.id; return x; }).filter(function(x){return x.effectiveFrom && x.rules;});
      resolveNames(); refreshForSla(); render();
    }, function(){});
    db.doc('config/stageTargets').onSnapshot(function(d){ applyTargets(d && d.exists ? d.data() : null); if(S.tab==='perf') render(); }, function(){});
    db.collection('actions').limit(500).onSnapshot(function(snap){ ACTIONS = {}; snap.docs.forEach(function(d){ var x = d.data()||{}; x.id = d.id; ACTIONS[d.id] = x; }); if(S.tab==='perf' && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.actId)) render(); }, function(){});
    db.doc('config/email').onSnapshot(function(d){ applySharedEmail(d && d.exists ? d.data() : null); if(S.tab==='email') render(); }, function(){});
    db.doc('config/holidays').onSnapshot(function(d){ var x = d && d.exists ? d.data() : null; if(JSON.stringify(x)===JSON.stringify(HOL_SHARED)) return; applyHolidays(x); render(); }, function(){});
    /* Update log: plain read (no server-side ordering), sorted here; one-time read if live updates fail. */
    var setLog = function(docs){ S.log = docs.map(function(d){ var x=d.data()||{}; x.id=d.id; return x; }).filter(function(x){ return x && x.type; }).sort(function(a,b){ return String(a.at)<String(b.at)?1:-1; }); S.logErr = ''; try{ resolveNames(); }catch(e){} if(S.tab==='updates'||S.tab==='email') render(); };
    var logOnce = function(){ try{ db.collection('log').limit(1000).get().then(function(s){ setLog(s.docs); }).catch(function(e){ S.logErr = (e&&(e.code||e.message))||'read failed'; if(S.tab==='updates') render(); }); }catch(e){ S.logErr = String(e&&e.message||e); } };
    S.reloadLog = logOnce;
    try{ db.collection('log').limit(1000).onSnapshot(function(snap){ setLog(snap.docs); }, function(e){ S.logErr = (e&&(e.code||e.message))||'live updates failed'; logOnce(); }); }catch(e){ logOnce(); }
    db.collection('snapshots').orderBy('date','desc').limit(120).onSnapshot(function(snap){
      S.snaps = snap.docs.map(function(d){ return d.data(); }).filter(function(x){return x && x.date;});
      resolveNames();
      var cur = S.snaps.filter(function(s){return s.date===S.date;})[0];
      if(!S.date || (!S.data && !S.loading)){ if(S.snaps[0]) loadSnap(S.snaps[0].date); else render(); }
      else if(cur && S.cache[S.date] && S.cache[S.date].file!==cur.file){ delete S.cache[S.date]; loadSnap(S.date); }
      else render();
    }, function(){ S.dbState='off'; render(); });
  }).catch(function(){ S.dbState='off'; render(); });
} else { S.dbState='off'; render(); }
})();
</script>

</body></html>
